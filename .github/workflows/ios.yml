name: iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "relay/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: 打包 IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: 工具
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: 编译、签名、打包
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Xuyu-ipa
          path: dist/**/*.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 7

  screenshots:
    name: 模拟器截图
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: 截图
        run: bash scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sim-build-log
          path: |
            sim-build.log
            ui-test.log
          retention-days: 7
